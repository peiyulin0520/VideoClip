<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#111111" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VideoClip" />
    <link rel="icon" type="image/png" href="/VideoClip/icons/favicon.png" />
    <link rel="apple-touch-icon" href="/VideoClip/icons/apple-touch-icon.png" />
    <title>VideoClip 剪輯</title>
    <script>
      // 先套用主題，避免打開時閃一下暗色（跟 src/ui/theme.ts 對得上）
      try {
        var t = localStorage.getItem('vc-theme');
        var bars = { mono: '#ffffff', fresh: '#f4fbf9', warm: '#2a1f18' };
        if (bars[t]) {
          document.documentElement.setAttribute('data-theme', t);
          document.querySelector('meta[name="theme-color"]').setAttribute('content', bars[t]);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
